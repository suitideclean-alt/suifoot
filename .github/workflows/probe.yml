name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Can a client read the decision log at all
        run: node tools/who.js
      - name: What the live site serves
        run: |
          echo -n "version: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo -n "buttons routed: "; curl -sS -m 25 "https://suifoot.fun/src/ui.js?v=0.9.52" | grep -c "Online.route"
          echo -n "log read: "; curl -sS -m 25 "https://suifoot.fun/src/chain.js?v=0.9.52" | grep -c "decide::Decided"
          echo -n "log written: "; curl -sS -m 25 "https://suifoot.fun/src/tx.js?v=0.9.52" | grep -c "decide::decide"
