name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: What the live site serves
        run: |
          echo -n "version: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo -n "assistant on the chain: "; curl -sS -m 25 "https://suifoot.fun/src/online.js?v=0.9.64" | grep -c "acmutual"
          echo -n "leaving a job: "; curl -sS -m 25 "https://suifoot.fun/src/ui.js?v=0.9.64" | grep -c "resignJob"
