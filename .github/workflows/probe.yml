# Which door does a browser knock on, now that JSON-RPC is closed?
name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: What shape does GetObject want
        run: |
          set +e
          OBJ=0xb882dd5f3819e8d4aa69b249cb6f17005ccd7a59e86596acd53d230fad69bf98
          URL=https://fullnode.testnet.sui.io/sui.rpc.v2.LedgerService/GetObject
          echo "=== headers and body, decompressed ==="
          curl -sS -m 25 --compressed -D - -X POST "$URL" \
               -H 'content-type: application/json' -H 'connect-protocol-version: 1' \
               -H 'origin: https://suitideclean-alt.github.io' \
               --data "{\"object_id\":\"$OBJ\",\"read_mask\":{\"paths\":[\"object_id\",\"object_type\",\"json\"]}}" | head -c 2500
          echo; echo
          echo "=== and what the CLI itself can read ==="
          echo "(the CLI works, so the data is certainly there)"

      - name: What the CLI reads
        run: |
          set -euo pipefail
          OBJ=0xb882dd5f3819e8d4aa69b249cb6f17005ccd7a59e86596acd53d230fad69bf98
          mkdir -p "$HOME/.sui/bin" "$HOME/.sui/unpack"
          curl -sSLf -o sui.tgz "https://github.com/MystenLabs/sui/releases/download/testnet-v1.84.1/sui-testnet-v1.84.1-ubuntu-x86_64.tgz"
          tar -xzf sui.tgz -C "$HOME/.sui/unpack"
          find "$HOME/.sui/unpack" -name 'sui' -type f -exec mv {} "$HOME/.sui/bin/sui" \;
          chmod +x "$HOME/.sui/bin/sui"
          export PATH="$HOME/.sui/bin:$PATH"
          sui client --yes new-env --alias tn --rpc https://fullnode.testnet.sui.io:443 >/dev/null 2>&1 || true
          sui client switch --env tn >/dev/null 2>&1 || true
          sui client object "$OBJ" --json | head -c 1500
          echo

      - name: And can several be asked for at once
        run: |
          set +e
          A=0xf018fa353ba993ba938f7a2d94fc4da641332cf7b50cad2b83e109b34533e21c
          B=0x8dda0f412dd1a9317d108d44c1aa8fd725bd620d939d7745ef90c99756f4e03a
          curl -sS -m 20 -X POST https://fullnode.testnet.sui.io/sui.rpc.v2.LedgerService/BatchGetObjects \
               -H 'content-type: application/json' \
               --data "{\"requests\":[{\"object_id\":\"$A\"},{\"object_id\":\"$B\"}],\"read_mask\":{\"paths\":[\"object_id\",\"json\"]}}" | head -c 900
          echo

      - name: Try the endpoints a browser could use
        run: |
          set +e
          OBJ=0xb882dd5f3819e8d4aa69b249cb6f17005ccd7a59e86596acd53d230fad69bf98
          Q='{"query":"{ object(address: \"'$OBJ'\") { address asMoveObject { contents { json } } } }"}'
          for URL in \
            https://sui-testnet.mystenlabs.com/graphql \
            https://graphql.testnet.sui.io \
            https://sui-testnet.mystenlabs.com/graphql/stable \
            https://testnet.sui.io/graphql ; do
            echo "=================== $URL"
            curl -sS -m 25 -D /tmp/h -X POST "$URL" -H 'content-type: application/json' \
                 -H 'origin: https://suitideclean-alt.github.io' --data "$Q" -o /tmp/b
            echo "status: $(head -1 /tmp/h)"
            echo "cors:   $(grep -i 'access-control-allow-origin' /tmp/h || echo 'none')"
            head -c 600 /tmp/b; echo; echo
          done

          echo "=================== REST / gRPC over HTTP"
          for URL in \
            "https://fullnode.testnet.sui.io/v1/objects/$OBJ" \
            "https://fullnode.testnet.sui.io/v2/objects/$OBJ" \
            "https://fullnode.testnet.sui.io/sui.rpc.v2.LedgerService/GetObject" ; do
            echo "--- $URL"
            curl -sS -m 20 -D /tmp/h2 -H 'accept: application/json' \
                 -H 'origin: https://suitideclean-alt.github.io' "$URL" -o /tmp/b2
            echo "status: $(head -1 /tmp/h2)"
            echo "cors:   $(grep -i 'access-control-allow-origin' /tmp/h2 || echo 'none')"
            head -c 400 /tmp/b2; echo; echo
          done
