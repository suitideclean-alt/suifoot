name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/who.js
      - name: What the live site serves
        run: |
          echo -n "version: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo -n "package: "; curl -sS -m 25 "https://suifoot.fun/src/chain.js?v=0.9.54" | grep -o "pkg: '0x[0-9a-f]\{8\}" | head -1
          echo -n "unwired buttons refused: "; curl -sS -m 25 "https://suifoot.fun/src/online.js?v=0.9.54" | grep -c "not_on_chain_yet"
