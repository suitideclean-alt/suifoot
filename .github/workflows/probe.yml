name: probe
on:
  workflow_dispatch:
    inputs:
      addr:
        description: an address to look at
        required: false
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/who.js
        env:
          ADDR: ${{ github.event.inputs.addr }}
