# Does that address have testnet SUI, and does the league still stand?
name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: The wallet, on testnet
        run: |
          set +e
          A=0x1130
          ADDR=$(echo "${{ github.event.inputs.addr }}")
          ADDR=${ADDR:-0x1130000000000000000000000000000000000000000000000000000000055c4}
          echo "asking about $ADDR"
          Q='{"query":"{ address(address: \"'$ADDR'\") { balance { totalBalance } } }"}'
          curl -sS -m 25 -X POST https://graphql.testnet.sui.io/graphql \
            -H 'content-type: application/json' --data "$Q"
          echo; echo

      - name: And the league itself
        run: |
          set +e
          L=0xc2dccce30329974a0503acae3ed9e6c32f70099034a0366b9fb3c39baf183119
          Q='{"query":"{ object(address: \"'$L'\") { version asMoveObject { contents { json } } } }"}'
          curl -sS -m 25 -X POST https://graphql.testnet.sui.io/graphql \
            -H 'content-type: application/json' --data "$Q" | head -c 700
          echo
