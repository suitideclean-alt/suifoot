# What version were the system objects shared at? We assume 1 for two of them.
name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Clock and Random, as the chain holds them
        run: |
          set +e
          Q='{"query":"{ clock: object(address: \"0x6\") { owner { __typename ... on Shared { initialSharedVersion } } } random: object(address: \"0x8\") { owner { __typename ... on Shared { initialSharedVersion } } } league: object(address: \"0xc2dccce30329974a0503acae3ed9e6c32f70099034a0366b9fb3c39baf183119\") { owner { __typename ... on Shared { initialSharedVersion } } } }"}'
          curl -sS -m 25 -X POST https://graphql.testnet.sui.io/graphql \
            -H 'content-type: application/json' --data "$Q"
          echo
