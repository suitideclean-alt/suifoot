name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: What the live site now serves
        run: |
          set +e
          echo -n "version: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo -n "hard-coded version 1 left in tx.js: "
          curl -sS -m 25 "https://suifoot.fun/src/tx.js?v=0.9.45" | grep -c "initialSharedVersion: '1'"
          echo -n "asks the chain instead: "
          curl -sS -m 25 "https://suifoot.fun/src/tx.js?v=0.9.45" | grep -c "sys.random"
