name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: What the live site serves
        run: |
          echo -n "version: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo -n "offer a job: "; curl -sS -m 25 "https://suifoot.fun/src/tx.js?v=0.9.59" | grep -c "jobs::"
          echo -n "buttons on the screen: "; curl -sS -m 25 "https://suifoot.fun/src/online.js?v=0.9.59" | grep -c "on:vacant\|on:accept\|on:dismiss\|on:resign\|on:offer"
