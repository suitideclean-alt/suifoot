# Is the domain pointed here yet?
name: probe
on:
  workflow_dispatch:
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: Both certificates, and what GitHub thinks
        run: |
          set +e
          for H in suifoot.fun www.suifoot.fun; do
            echo "=== $H ==="
            echo | timeout 20 openssl s_client -servername "$H" -connect "$H":443 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null | sed 's/^/  /'
            echo
          done
          echo "=== what the Pages API says ==="
          curl -sS -m 20 -H "accept: application/vnd.github+json" \
            https://api.github.com/repos/suitideclean-alt/suifoot/pages | head -c 900
          echo
          echo
          echo "=== is the CNAME file actually being served ==="
          curl -sS -m 20 https://suifoot.fun/CNAME -w ' <- %{http_code}\n'

      - name: suifoot.fun
        run: |
          set +e
          echo "=== what the name resolves to ==="
          dig +short suifoot.fun A | sed 's/^/  apex : /'
          dig +short www.suifoot.fun CNAME | sed 's/^/  www  : /'
          echo
          echo "  (GitHub Pages answers on 185.199.108-111.153)"
          echo
          echo "=== what answers over http ==="
          for U in http://suifoot.fun/ https://suifoot.fun/ https://www.suifoot.fun/ https://suifoot.fun/badges/7.svg; do
            OUT=$(curl -sS -o /tmp/b -D /tmp/h -m 25 -L -w '%{http_code} after %{num_redirects} redirect(s), %{size_download} bytes' "$U" 2>&1)
            echo "  $U"
            echo "    $OUT"
            grep -i '^server:' /tmp/h 2>/dev/null | sed 's/^/    /'
            head -c 60 /tmp/b 2>/dev/null | tr -d '\n' | sed 's/^/    body: /'
            echo; echo
          done
          echo "=== certificate ==="
          echo | timeout 20 openssl s_client -servername suifoot.fun -connect suifoot.fun:443 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null | sed 's/^/  /' || echo "  no certificate yet"
