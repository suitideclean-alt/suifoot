name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/who.js
      - name: What the live site serves
        run: |
          echo -n "version: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo -n "replay loaded: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -c "replay.js"
          echo -n "sends draw_week: "; curl -sS -m 25 "https://suifoot.fun/src/tx.js?v=0.9.48" | grep -c "draw_week"
