name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: What the live site serves
        run: |
          echo -n "version: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo -n "bridge loaded: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -c "bridge.js"
          echo -n "way in present: "; curl -sS -m 25 "https://suifoot.fun/src/online.js?v=0.9.51" | grep -c "on:play"
          echo -n "way out present: "; curl -sS -m 25 "https://suifoot.fun/src/ui.js?v=0.9.51" | grep -c "on:back"
