name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: How does one read an event log here
        run: |
          set +e
          ask () { echo "--- $1"; curl -sS -m 25 -X POST https://graphql.testnet.sui.io/graphql \
            -H 'content-type: application/json' --data "{\"query\":\"$2\"}" | head -c 600; echo; }
          ask "by eventType" "{ events(filter: {eventType: \\\"0x2::coin::CurrencyCreated\\\"}, first: 2) { nodes { contents { json } } } }"
          ask "by type"      "{ events(filter: {type: \\\"0x2::coin::CurrencyCreated\\\"}, first: 2) { nodes { contents { json } } } }"
          ask "with paging"  "{ events(filter: {eventType: \\\"0x2::coin::CurrencyCreated\\\"}, first: 2) { pageInfo { hasNextPage endCursor } nodes { timestamp transactionDigest contents { json } } } }"
