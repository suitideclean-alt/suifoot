# Is the live site serving the version we just pushed?
name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: What suifoot.fun serves
        run: |
          set +e
          curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo "--- chain.js has the balance question:"
          curl -sS -m 25 "https://suifoot.fun/src/chain.js?v=0.9.44" | grep -c "coinType"
          echo "--- and the faucet link:"
          curl -sS -m 25 "https://suifoot.fun/src/chain.js?v=0.9.44" | grep -o "faucet.sui.io[^']*" | head -1
