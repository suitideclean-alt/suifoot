name: probe
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: What the live site serves
        run: |
          echo -n "version: "; curl -sS -m 25 https://suifoot.fun/index.html | grep -o 'v=0\.9\.[0-9]*' | head -1
          echo -n "the team sheet button: "; curl -sS -m 25 "https://suifoot.fun/src/ui.js?v=0.9.63" | grep -c "sendteam"
          echo -n "the sheet is a decision: "; curl -sS -m 25 "https://suifoot.fun/src/replay.js?v=0.9.63" | grep -c "K.TEAM"
