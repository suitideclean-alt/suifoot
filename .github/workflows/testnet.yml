# Publish the contract to the Sui testnet and actually play a match on it.
#
# Tests prove the rules. This proves the thing runs on a real chain: that the objects can be made,
# that the randomness arrives, and what a matchday really costs in gas - the one number that unit
# tests cannot tell us.
#
# The key is made fresh inside the run and thrown away with it. Testnet coins are worthless, nothing
# is stored, and nobody has to hold a secret for this to work. The published package therefore has no
# upgrade authority that outlives the run, which is correct: this is a rehearsal, not a deployment.
name: testnet
on:
  workflow_dispatch:
    inputs:
      clubs:
        description: how many clubs to make (even)
        default: "18"
      play:
        description: play a matchday as well
        default: "true" 
env:
  SUI_VERSION: testnet-v1.84.1
jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the Sui CLI
        id: cache-sui
        uses: actions/cache@v4
        with:
          path: ~/.sui/bin
          key: sui-${{ env.SUI_VERSION }}-ubuntu-x86_64

      - name: Install the Sui CLI
        if: steps.cache-sui.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.sui/bin" "$HOME/.sui/unpack"
          curl -sSLf -o sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          tar -xzf sui.tgz -C "$HOME/.sui/unpack"
          find "$HOME/.sui/unpack" -name 'sui' -type f -exec mv {} "$HOME/.sui/bin/sui" \;
          chmod +x "$HOME/.sui/bin/sui"

      - name: An address of its own, and coins from the faucet
        run: |
          set -euo pipefail
          echo "$HOME/.sui/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.sui/bin:$PATH"
          sui client --yes new-env --alias tn --rpc https://fullnode.testnet.sui.io:443 || true
          sui client switch --env tn
          ADDR=$(sui client active-address)
          echo "address: $ADDR"
          echo "ADDR=$ADDR" >> "$GITHUB_ENV"
          # The faucet wants its base URL and does its own proof of work from there. It hands over
          # one SUI at a time and publishing a package this size costs most of one, so ask three
          # times and leave it at that rather than trying to read the balance back.
          for i in 1 2 3 4 5; do
            sui client faucet --url https://faucet.testnet.sui.io || true
            sleep 14
          done
          sui client gas || true

      - name: Publish
        run: |
          set -euo pipefail
          export PATH="$HOME/.sui/bin:$PATH"
          # the package has grown; publishing is the one call that needs real room
          if ! sui client publish --gas-budget 2500000000 --json move/suifoot > publish.json 2> publish.err; then
            echo "--- what the node said ---"
            echo '(anything that looks like a refusal)'
            grep -inE 'error|insufficient|budget|balance|cannot|unable|abort' publish.json publish.err | grep -viE 'warning|deprecat|suppress' | head -20
            echo '(first lines of stdout)'; head -12 publish.json
            echo '(gas on hand)'; sui client gas 2>&1 | head -8
            exit 1
          fi
          PKG=$(jq -r '.objectChanges[] | select(.type=="published") | .packageId' publish.json)
          echo "package: $PKG"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "publish cost (MIST):"
          jq -r '.effects.gasUsed | "computation \(.computationCost)  storage \(.storageCost)  rebate \(.storageRebate)"' publish.json

      - name: Make a league and two clubs
        run: |
          set -euo pipefail
          export PATH="$HOME/.sui/bin:$PATH"
          NOW=$(( $(date +%s) * 1000 ))
          # a league whose first matchday kicked off yesterday, so a fixture can be played at once
          T0=$(( NOW - 172800000 ))
          SIZE=${{ github.event.inputs.clubs || 18 }}
          sui client call --package "$PKG" --module league --function create \
            --args "$T0" "[720,1200]" $(( (SIZE - 1) * 2 )) 3 "$SIZE" --gas-budget 200000000 --json > league.json
          LEAGUE=$(jq -r '.objectChanges[] | select(.objectType != null and (.objectType | test("::league::League$"))) | .objectId' league.json)
          echo "league: $LEAGUE"
          echo "LEAGUE=$LEAGUE" >> "$GITHUB_ENV"
          echo "league cost (MIST):"
          jq -r '.effects.gasUsed | "computation \(.computationCost)  storage \(.storageCost)"' league.json

          for N in $(seq 1 ${{ github.event.inputs.clubs || 18 }}); do
            sui client call --package "$PKG" --module world --function create_club \
              --args "$LEAGUE" "$N" 3 0 0x8 --gas-budget 500000000 --json > "club$N.json"
            CID=$(jq -r '.objectChanges[] | select(.objectType != null and (.objectType | test("::club::Club$"))) | .objectId' "club$N.json")
            echo "club $N: $CID"
            echo "CLUB$N=$CID" >> "$GITHUB_ENV"
            CLUB_IDS="${CLUB_IDS:-}$CID "
            jq -r '.effects.gasUsed | "  cost: computation \(.computationCost)  storage \(.storageCost)"' "club$N.json"
          done
          echo "CLUB_IDS=$CLUB_IDS" >> "$GITHUB_ENV"

          # everything the browser needs to find this league again, in one block to copy out
          echo "::group::config"
          echo "PACKAGE $PKG"
          echo "LEAGUE  $LEAGUE"
          for C in $CLUB_IDS; do echo "CLUB    $C"; done
          echo "::endgroup::" 

      - name: Take a club, and decide something with it
        run: |
          set -euo pipefail
          export PATH="$HOME/.sui/bin:$PATH"

          # the draw, which hands back a ticket naming the club it landed on
          sui client call --package "$PKG" --module market --function request_join \
            --args "$LEAGUE" 0x8 --gas-budget 500000000 --json > join.json
          TICKET=$(jq -r '.objectChanges[] | select(.objectType != null and (.objectType | test("::market::JoinTicket$"))) | .objectId' join.json)
          CLUB=$(jq -r '.events[]? | .parsedJson | .club // empty' join.json | head -1)
          echo "ticket $TICKET names club $CLUB"
          echo "  the draw cost:"; jq -r '.effects.gasUsed | "    computation \(.computationCost)  storage \(.storageCost)  rebate \(.storageRebate)"' join.json

          # and the ticket turned in, which is what makes the club somebody's
          sui client call --package "$PKG" --module market --function claim \
            --args "$TICKET" "$LEAGUE" "$CLUB" --gas-budget 500000000 --json > claim.json
          echo "  taking it cost:"; jq -r '.effects.gasUsed | "    computation \(.computationCost)  storage \(.storageCost)  rebate \(.storageRebate)"' claim.json

          # the number the whole rest of the game turns on: what one decision costs
          sui client call --package "$PKG" --module decide --function decide \
            --args "$LEAGUE" "$CLUB" 3 1 0 "[]" 0x6 --gas-budget 500000000 --json > decide.json
          echo "=============================================="
          echo "WHAT ONE DECISION COSTS, in MIST (1 SUI = 1,000,000,000):"
          jq -r '.effects.gasUsed | "  computation \(.computationCost)\n  storage     \(.storageCost)\n  rebate      \(.storageRebate)"' decide.json
          echo "  and what it wrote down:"
          jq -r '.events[]? | .parsedJson | "    club \(.club_num)  week \(.week)  kind \(.kind)  a \(.a)"' decide.json
          echo "=============================================="

      - name: Draw a matchday on the chain
        if: ${{ github.event.inputs.play != 'false' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.sui/bin:$PATH"
          # The whole cost of a matchday: one number. The six matches follow from it, and are
          # worked out by whoever is looking rather than paid for here.
          sui client call --package "$PKG" --module league --function draw_week \
            --args "$LEAGUE" 0x8 0x6 --gas-budget 500000000 --json > match.json
          echo "=============================================="
          echo "the matchday, worked out from the number the chain drew:"
          PKG="$PKG" LEAGUE="$LEAGUE" CLUBS="$CLUB_IDS" node tools/who.js || true
          echo ""
          echo "what a matchday now costs, in MIST (1 SUI = 1,000,000,000):"
          jq -r '.effects.gasUsed | "  computation \(.computationCost)\n  storage     \(.storageCost)\n  rebate      \(.storageRebate)"' match.json
          echo "=============================================="

      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-run
          path: "*.json"
