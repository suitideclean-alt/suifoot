name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  # The browser half, read against the real chain: the same file the page loads, the same RPC calls,
  # the same field names. It needs the network, so it does not run with the rest.
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run chain
      - run: npm run tx

      # A deed in a wallet asks the web for its badge. A broken picture there is a broken NFT, so
      # the file has to actually be where the contract says it is.
      # A deed in a wallet asks the web for its badge. A broken picture there is a broken NFT, so
      # the file has to actually be where the contract says it is - which is suifoot.fun, the address
      # written into the deed. The old github.io address now redirects there, and that is checked too.
      - name: The badges are where a wallet will look for them
        run: |
          set -euo pipefail
          for N in 0 7 42 599; do
            CODE=$(curl -sS -o /tmp/b -w '%{http_code}' -m 20 "https://suifoot.fun/badges/$N.svg")
            echo "  suifoot.fun/badges/$N.svg -> $CODE, $(wc -c < /tmp/b) bytes"
            [ "$CODE" = "200" ] || { echo "the badge the deed points at is not there"; exit 1; }
            head -c 5 /tmp/b | grep -q '<svg' || { echo "that is not an svg"; exit 1; }
          done
          OLD=$(curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url}' -m 20 \
                "https://suitideclean-alt.github.io/suifoot/badges/7.svg")
          echo "  the old address: $OLD"

