name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  # The browser half, read against the real chain: the same file the page loads, the same RPC calls,
  # the same field names. It needs the network, so it does not run with the rest.
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Red here means the browser cannot read the chain, which is true today and not our doing:
      # Sui retired JSON-RPC on public nodes. Kept running and kept visible, so the day a transport
      # is written this is what says it works.
      - run: npm run chain
        continue-on-error: true
