# The money, on a real chain, with real keys: the tap, the fee, the treasury, taking a club back,
# and a deed that must stop working. Three throwaway people; see tools/dues.sh for what is checked.
name: dues
on:
  workflow_dispatch:
env:
  SUI_VERSION: testnet-v1.84.1
jobs:
  dues:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the Sui CLI
        id: cache-sui
        uses: actions/cache@v4
        with:
          path: ~/.sui/bin
          key: sui-${{ env.SUI_VERSION }}-ubuntu-x86_64

      - name: Install the Sui CLI
        if: steps.cache-sui.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.sui/bin" "$HOME/.sui/unpack"
          curl -sSLf -o sui.tgz "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz"
          tar -xzf sui.tgz -C "$HOME/.sui/unpack"
          find "$HOME/.sui/unpack" -name 'sui' -type f -exec mv {} "$HOME/.sui/bin/sui" \;
          chmod +x "$HOME/.sui/bin/sui"

      - name: A league of its own to play in
        run: |
          set -euo pipefail
          export PATH="$HOME/.sui/bin:$PATH"
          # the step that follows runs node, not bash, and wants the tool on its own PATH
          echo "$HOME/.sui/bin" >> "$GITHUB_PATH"
          sui client --yes new-env --alias tn --rpc https://fullnode.testnet.sui.io:443 || true
          sui client switch --env tn
          # The faucet hands over one SUI at a time, and publishing a package this size costs most
          # of one before a single club exists. Ask several times rather than reading the balance
          # back, which the node is often too far behind to answer honestly.
          for i in 1 2 3 4 5 6; do
            sui client faucet --url https://faucet.testnet.sui.io || true
            sleep 14
          done

          sui client publish ./move/suifoot --gas-budget 1000000000 --json > publish.json 2>/dev/null
          PKG=$(jq -r '.objectChanges[] | select(.type == "published") | .packageId' publish.json)
          echo "PKG=$PKG" >> "$GITHUB_ENV"

          NOW=$(( $(date +%s) * 1000 ))
          sui client call --package "$PKG" --module league --function create \
            --args $(( NOW - 172800000 )) "[720,1200]" 34 3 18 --gas-budget 200000000 --json > league.json
          LEAGUE=$(jq -r '.objectChanges[] | select(.objectType != null and (.objectType | test("::league::League$"))) | .objectId' league.json)
          echo "LEAGUE=$LEAGUE" >> "$GITHUB_ENV"

          TREASURY=$(jq -r '.objectChanges[] | select(.objectType != null and (.objectType | test("::sfoot::Treasury$"))) | .objectId' publish.json)
          FAUCET=$(jq -r '.objectChanges[] | select(.objectType != null and (.objectType | test("::faucet::Faucet$"))) | .objectId' publish.json)
          echo "TREASURY=$TREASURY" >> "$GITHUB_ENV"; echo "FAUCET=$FAUCET" >> "$GITHUB_ENV"
          sui client call --package "$PKG" --module league --function set_entry --args "$LEAGUE" 5000000 3 --gas-budget 50000000 --json >/dev/null
          sui client call --package "$PKG" --module faucet --function open --args "$FAUCET" 100000000 10000000000 --gas-budget 50000000 --json >/dev/null

          IDS=""
          for N in $(seq 1 18); do
            sui client call --package "$PKG" --module world --function create_club \
              --args "$LEAGUE" "$N" 3 0 0x8 --gas-budget 500000000 --json > "club$N.json"
            IDS="$IDS$(jq -r '.objectChanges[] | select(.objectType != null and (.objectType | test("::club::Club$"))) | .objectId' "club$N.json") "
          done
          echo "CLUBS=$IDS" >> "$GITHUB_ENV"
          echo "league $LEAGUE with 18 clubs, on package $PKG"

      - name: Let them pay
        run: bash tools/dues.sh
        env:
          PKG: ${{ env.PKG }}
          LEAGUE: ${{ env.LEAGUE }}
          TREASURY: ${{ env.TREASURY }}
          FAUCET: ${{ env.FAUCET }}
